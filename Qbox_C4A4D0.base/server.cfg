# ============================================================
# GTACORE RP
# SERVER CONFIG
# ============================================================

# ============================================================
# EDITABLE
# ============================================================

endpoint_add_tcp "0.0.0.0:30120"
endpoint_add_udp "0.0.0.0:30120"

sv_maxclients 48

set steam_webApiKey "none"

sets tags "roleplay, spanish, espana, gtacore, qbox"

# ============================================================
# SERVER IDENTITY
# ============================================================

# IMPORTANTE:
# Sustituye [PON_AQUI_TU_NUEVA_CLAVE] por una NUEVA clave Cfx.re.
# NO publiques esta clave ni la subas a GitHub.

sv_licenseKey "cfxk_1T70MkMmLCrpo94uGFc0V_1ZdKh7"

sv_hostname "GTACORE RP | DEV"

sets sv_projectName "GTACORE RP"

sets sv_projectDesc "Servidor de desarrollo de GTACORE Roleplay."

sets locale "es-ES"

load_server_icon myLogo.png

# ============================================================
# GAME BUILD
# ============================================================

# Mantener la build utilizada por la receta actual de Qbox.
set sv_enforceGameBuild 3258

# ============================================================
# ONESYNC
# ============================================================

set onesync on

# ============================================================
# DATABASE
# ============================================================

# TEMPORALMENTE dejamos la conexión que ya funciona
# en tu instalación local.
#
# Más adelante sustituiremos root por un usuario dedicado.

set mysql_connection_string "mysql://root@localhost/Qbox_C4A4D0?charset=utf8mb4"

# ============================================================
# CHAT
# ============================================================

set resources_useSystemChat true

set qbx_chat:joinMessage "^2%s ha entrado al servidor"

set qbx_chat:quitMessage "^1%s ha salido del servidor (%s)"

# ============================================================
# VOICE
# ============================================================

exec voice.cfg

# ============================================================
# QBOX CONFIG
# ============================================================

setr qb_locale "es"

setr qbx:enableBridge "true"

set qbx:enableQueue "true"

set qbx:bucketLockdownMode "inactive"

set qbx:discordLink "discord.gg/pWw6cV7hAE"

set qbx:max_jobs_per_player 1

set qbx:max_gangs_per_player 1

set qbx:setjob_replaces "true"

set qbx:setgang_replaces "true"

set qbx:cleanPlayerGroups "true"

set qbx:allowMethodOverrides "true"

set qbx:disableOverrideWarning "false"

setr qbx:enableVehiclePersistence "false"

setr qbx:vehiclePersistenceType "semi"

set qbx:acknowledge "false"

setr qbx:enableGroupManagement "false"

# ============================================================
# GTACORE MOTD
# ============================================================

setr qbx:motd "<p style='padding:1rem;background-color:#111318;border:1px solid #2a2e36;border-radius:.5rem;text-align:center;'><span style='color:#e5b93f;font-size:1.3rem;font-weight:700;'>GTACORE RP</span><br><span style='color:#d0d0d0;'>Bienvenido a GTACORE Roleplay</span></p>"

# ============================================================
# ILLENIUM APPEARANCE
# ============================================================

setr illenium-appearance:locale "es"

# ============================================================
# RENEWED WEATHERSYNC
# ============================================================

setr weather_disablecd true

# ============================================================
# OX CONFIG
# ============================================================

exec ox.cfg

# ============================================================
# NPWD
# ============================================================

set npwd:framework "qbx"

set SCREENSHOT_BASIC_TOKEN ""

set NPWD_AUDIO_TOKEN ""

# ============================================================
# LOADSCREEN
# ============================================================

setr loadscreen:externalShutdown true

set loadscreen:primaryColor "#D9A441"

set loadscreen:shadowColor "#111111CC"

# ============================================================
# DEFAULT CFX RESOURCES
# ============================================================

ensure mapmanager
ensure chat
ensure spawnmanager
ensure baseevents

# ============================================================
# CORE OX
# ============================================================

ensure ox_lib
ensure oxmysql
ensure qbx_core
ensure ox_target

# ============================================================
# OX CATEGORY
# ============================================================

ensure [ox]

# ============================================================
# QBOX CATEGORY
# ============================================================

ensure [qbx]

# ============================================================
# STANDALONE
# ============================================================

ensure [standalone]

# ============================================================
# VOICE
# ============================================================

ensure [voice]

# ============================================================
# GTACORE ASSETS
# ============================================================
#
# TODO LO QUE HAY DENTRO DE [assets] FORMA PARTE
# DEL SERVIDOR PRINCIPAL.

ensure [assets]

# ============================================================
# NPWD APPS
# ============================================================

ensure [npwd-apps]

ensure qbx_npwd

ensure npwd

# ============================================================
# PERMISSIONS
# ============================================================

# Tu identificador de Cfx.re
add_principal identifier.fivem:13748322 group.admin

# Tu identificador de Discord
add_principal identifier.discord:726585674756522077 group.admin

exec permissions.cfg

# ============================================================
# MISCELLANEOUS
# ============================================================

exec misc.cfg